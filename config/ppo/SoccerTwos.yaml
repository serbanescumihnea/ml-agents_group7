behaviors:
    SoccerTwos:
      trainer_type: ppo
      hyperparameters:
        # Optimized for faster learning while maintaining stability
        batch_size: 1024          # Reduced for faster updates
        buffer_size: 10240        # Maintained 10x batch_size ratio
        learning_rate: 5.0e-4     # Slightly increased for faster learning
        learning_rate_schedule: linear

        # PPO-specific parameters
        beta: 8.0e-3              # Increased for better exploration
        beta_schedule: linear
        epsilon: 0.2
        epsilon_schedule: linear
        lambd: 0.95
        num_epoch: 4              # Increased for better policy utilization

      network_settings:
        normalize: true
        hidden_units: 256
        num_layers: 2
        memory:
          sequence_length: 128     # Increased for better memory utilization
          memory_size: 256

      # Optimized self-play settings
      self_play:
        window: 10
        play_against_latest_model_ratio: 0.5
        save_steps: 25000         # More frequent saves
        swap_steps: 1000          # More frequent opponent switching
        team_change: 50000        # More frequent team changes

      max_steps: 2000000          # Reduced for faster completion
      time_horizon: 64
      summary_freq: 10000
      keep_checkpoints: 5
      checkpoint_interval: 25000   # More frequent checkpoints

      reward_signals:
        extrinsic:
          gamma: 0.99
          strength: 1.0

environment_parameters:
    ball_touch: 1.0
